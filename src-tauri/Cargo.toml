[package]
name = "peidu"
version = "0.1.0"
description = "陪读桌面版"
authors = ["peidu"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "peidu_lib"
# 纯桌面应用（tauri.conf.json 无 bundle.mobile），只需要 rlib。
# staticlib/cdylib 仅供 Android/iOS 打包给 Java/Swift 调用；桌面下
# main.rs 只链接 rlib，多编一份 cdylib/staticlib 会把整条依赖树
# （含 rusqlite bundled 的 SQLite C 源码）再编译+链接一遍，白等几分钟。
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-deep-link = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-window-state = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
chardetng = "0.1"
notify = "6"
rusqlite = { version = "0.31", features = ["bundled"] }
parking_lot = "0.12"
once_cell = "1"

# 预留：Word 解析（D5+）
# docx-rs = "0.4"
# calamine = "0.24"

[features]
custom-protocol = ["tauri/custom-protocol"]

# 日常构建提速：只覆盖自家 crate，依赖保持默认 opt-level=3 的已缓存产物，不触发全树重编。
# 背景：tauri 资源嵌入宏把 dist/ 资产纳入 rustc 依赖追踪（见 deps/*.d），vite 每次重写
# dist 都会让 peidu crate 指纹失效，默认非增量模式下即整包重新 codegen（实测 ~71s）。
# opt-level=1 + 更多 codegen unit 降低单次成本；incremental 让重编只做受影响分块。
[profile.release.package.peidu]
opt-level = 1
codegen-units = 64
incremental = true
